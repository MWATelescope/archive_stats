[project]
name = "archive_stats"
version = "1.0.1"
requires-python = ">=3.14,<3.15"
dependencies = [
    "astropy",
    "boto3",
    "matplotlib",
    "pyvo",
    "numpy",
    "psycopg2-binary",
    "ruff",
    "ty"
]

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.format]
quote-style = "double"